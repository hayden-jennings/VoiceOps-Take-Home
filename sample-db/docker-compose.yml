services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceops
      POSTGRES_USER: voiceops
      POSTGRES_PASSWORD: voiceops
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./02-app-role.sql:/docker-entrypoint-initdb.d/02-app-role.sql
      - ./03-dashboard-instances.sql:/docker-entrypoint-initdb.d/03-dashboard-instances.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceops"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stretch goal from the original brief — the app runs fully in the same
  # compose network as the DB, no local Node install needed. Requires
  # ANTHROPIC_API_KEY to be set — either export it in your shell before
  # `docker compose up`, or create a `.env` file next to this compose file
  # (sample-db/.env) with ANTHROPIC_API_KEY=sk-... — docker compose loads
  # that automatically. Nothing else needs local config; DATABASE_URL here
  # points at the `postgres` service by its compose network hostname, not
  # localhost (the app itself never hardcodes localhost — this is the only
  # place the connection string is assembled).
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://voiceops:voiceops@postgres:5432/voiceops
      DATABASE_URL_READONLY: postgresql://voiceops_readonly:voiceops_readonly@postgres:5432/voiceops
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or sample-db/.env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
